<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Get started with a free and open-source admin dashboard layout built with Tailwind CSS and Flowbite featuring charts, widgets, CRUD layouts, authentication pages, and more">
    <meta name="author" content="Themesberg">
    <meta name="generator" content="Hugo 0.58.2">
    <title>{% block title %}Page Title{% endblock %}</title>

    {% comment %} <link rel="canonical" href="https://flowbite-admin-dashboard.vercel.app/authentication/sign-in/"> {% endcomment %}
    {% comment %} <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""> {% endcomment %}
   
<link href="{% static 'font/css2.css' %}" rel="stylesheet">
<link href="{% static 'css/app.css' %}" rel="stylesheet">
<link href="{% static 'remixicon/remixicon.css' %}" rel="stylesheet">


    <script>
        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark')
        }
    </script>
</head>
<body class="bg-gray-50 dark:bg-gray-800 ">
    {% block content %}
    {% endblock %}
    <script async defer src="{% static 'js/app.bundle.js' %}"></script>
    <script async defer src="{% static 'js/app.bundle2.js' %}"></script>
    <script async defer src="{% static 'js/buttons.js' %}"></script>
    <script async defer src="{% static 'js/datepicker.min.js' %}"></script>
    
</body>
</html>
